# 复制为 .streamlit/secrets.toml 并填入你自己的密钥（secrets.toml 已在 .gitignore 中，不会被提交）
# 至少配置一个可用平台；主平台余额不足时系统会自动切换到下一个可用平台。
DEEPSEEK_API_KEY = "sk-你的deepseek密钥"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-v4-flash"

BAILIAN_API_KEY = "sk-你的阿里云百炼密钥"
BAILIAN_BASE_URL = "https://dashscope.aliyuncs.com/compatible-mode/v1"
BAILIAN_MODEL = "qwen-plus"

ZHIPU_API_KEY = "你的智谱密钥"
ZHIPU_BASE_URL = "https://open.bigmodel.cn/api/paas/v4"
ZHIPU_MODEL = "glm-5.1"

# ── 用户认证（Supabase Auth · 邮箱验证码回填注册）──
# 必须配置，应用启动后所有注册/登录都走 Supabase Auth；不再有本地回退。
# 1) Supabase Dashboard → Authentication → Sign in / Providers → Email
#    开启 Email provider + "Confirm email"
# 2) Supabase Dashboard → Authentication → SMTP Settings
#    配置自定义 SMTP（如 Brevo）—— 免费档默认模板不可改，必须配 SMTP
# 3) Supabase Dashboard → Authentication → Email Templates → "Confirm signup"
#    模板必须用 {{ .Token }} 输出 6 位数字验证码（不要用 {{ .ConfirmationURL }} 链接）
# 4) 把下方 URL / anon key 填好后重启应用
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
